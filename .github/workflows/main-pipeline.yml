name: main-pipeline

on:
  push:
    branches: [master]

jobs:
  gate-secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # scripts/fix-deps.sh mirrors this job's steps by hand in its pre-commit gate,
  # so a dependency refresh cannot commit green here and red on CI (P123 /
  # RFC-003). Adding a step below without adding it there re-opens that gap.
  build:
    name: Lint, check deps & build
    needs: [gate-secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check dependency freshness
        run: npm run deps:check

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: static-site-${{ github.sha }}
          path: out/
          retention-days: 1

  gate-accessibility:
    name: Accessibility gate
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: static-site-${{ github.sha }}
          path: out/

      - name: Run accessibility checks
        run: |
          npx serve out -l 3000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null && break
            sleep 1
          done
          npx pa11y-ci

  deploy-test:
    name: Deploy draft + smoke test
    needs: build
    runs-on: ubuntu-latest
    outputs:
      deploy_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: static-site-${{ github.sha }}
          path: out/

      - name: Deploy draft to Netlify
        id: deploy
        run: |
          OUTPUT=$(npx netlify deploy --dir=out --json --message "main-${{ github.sha }}" --alias main-test)
          echo "url=$(echo "$OUTPUT" | jq -r '.deploy_url')" >> "$GITHUB_OUTPUT"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Smoke test
        run: |
          # --retry 3 covers the transient set only: timeouts and 408/429/5xx
          # (P143, after a curl (28) connect timeout reddened master on a
          # docs-only commit and skipped the release job). A 404 is NOT
          # transient, so a genuinely broken page still fails on attempt one.
          # Deliberately not retry-all-errors: that would swallow DNS and TLS
          # failures, which on a Netlify alias mean a real misconfiguration.
          # Delay is curl's default exponential backoff (1s, 2s, 4s); the
          # green path costs nothing because retries only fire on error.
          URL="${{ steps.deploy.outputs.url }}"
          echo "Testing $URL"

          STATUS=$(curl -sS -L -o /tmp/home.html -w "%{http_code}" --retry 3 --retry-connrefused --connect-timeout 15 --max-time 30 "$URL/")
          [ "$STATUS" = "200" ] || { echo "Homepage returned $STATUS"; exit 1; }
          grep -q "Tom Howard" /tmp/home.html || { echo "Homepage missing expected content"; exit 1; }

          STATUS=$(curl -sS -L -o /dev/null -w "%{http_code}" --retry 3 --retry-connrefused --connect-timeout 15 --max-time 30 "$URL/blog/")
          [ "$STATUS" = "200" ] || { echo "/blog/ returned $STATUS"; exit 1; }

          STATUS=$(curl -sS -L -o /dev/null -w "%{http_code}" --retry 3 --retry-connrefused --connect-timeout 15 --max-time 30 "$URL/vibe-code-audit/")
          [ "$STATUS" = "200" ] || { echo "/vibe-code-audit/ returned $STATUS"; exit 1; }

          STATUS=$(curl -sS -L -o /dev/null -w "%{http_code}" --retry 3 --retry-connrefused --connect-timeout 15 --max-time 30 "$URL/blog/before-it-goes-live-you-should-be-able-to-click-on-it/")
          [ "$STATUS" = "200" ] || { echo "blog post returned $STATUS"; exit 1; }

  release-pr:
    name: Create release PR
    needs: [deploy-test]
    # Without an `if:`, a failed deploy-test renders this job as SKIPPED, and
    # since it is the only path to production the pipeline reports the absence
    # of a release rather than a refusal to make one (P143). Any `if:` drops the
    # implicit success() on `needs`, so the job runs and the guard below fails
    # it loudly. `!cancelled()` rather than `always()`: a run the user cancelled
    # should not produce a spurious red.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Require a successful deploy and smoke test
        if: needs.deploy-test.result != 'success'
        run: |
          echo "deploy-test concluded '${{ needs.deploy-test.result }}', not 'success'."
          echo "No release PR will be created. Failing rather than skipping so the"
          echo "production path is visibly blocked instead of silently quiet (P143)."
          exit 1

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      # Counted BEFORE the changesets step, which runs `changeset version` and
      # DELETES the changeset files it consumes. Counting afterwards would read
      # zero in the one case the report step below exists to catch, take the
      # nothing-queued branch, and pass green.
      - name: Count queued changesets
        id: queued
        run: |
          COUNT=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "count=${COUNT:-0}" >> "$GITHUB_OUTPUT"

      - name: Create or update release PR
        id: changesets
        # v1.9.0. Pin the commit SHA, not the annotated-tag-object SHA: both
        # resolve in Actions, but commit-oriented tooling (gh api .../commits,
        # Dependabot's action updater, pinning auditors) fails on the tag form.
        # The prior pin was v1.5.3's tag object, which targeted Node 20.
        #
        # Verified at this exact ref before the bump: action.yml declares
        # `using: "node24"`, and its `outputs:` block still declares
        # `pullRequestNumber` (byte-identical to v1.5.3's). That output is
        # load-bearing twice below, and if it were dropped both steps would
        # skip silently on a green job. Re-verify it when next bumping.
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
        with:
          publish: echo "publish handled by publish-pipeline"
          version: npm run changeset:version
          commit: "pipeline: release"
          title: "pipeline: release"
          createGithubReleases: false
          branch: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Three outcomes, all legible. Without this the no-PR case is a silent
      # green job, indistinguishable from a working release (P143), and a
      # dropped `pullRequestNumber` output would skip both steps below on a
      # green job with no signal at all (P141).
      - name: Report release-PR outcome
        if: always() && steps.changesets.outcome == 'success'
        run: |
          QUEUED="${{ steps.queued.outputs.count }}"
          PR="${{ steps.changesets.outputs.pullRequestNumber }}"
          if [ -n "$PR" ]; then
            echo "Release PR #$PR created or updated from $QUEUED changeset(s)."
          elif [ "${QUEUED:-0}" -eq 0 ]; then
            echo "No release PR created: the changeset queue was empty at the start"
            echo "of this job, so the release path is not armed for this commit."
            echo "If this commit changed site sources, it will not reach production"
            echo "until a changeset lands (P115). This is not 'nothing to release'."
          else
            echo "$QUEUED changeset(s) were queued but changesets/action returned no"
            echo "pullRequestNumber. Either the PR was not created, or the action's"
            echo "output contract changed. The two steps below gate on that output"
            echo "and would otherwise skip silently on a green job (P143 / P141)."
            exit 1
          fi

      - name: Add preview URL to release PR
        if: steps.changesets.outputs.pullRequestNumber
        run: |
          PR_NUMBER="${{ steps.changesets.outputs.pullRequestNumber }}"
          PREVIEW_URL="${{ needs.deploy-test.outputs.deploy_url }}"
          CURRENT_BODY="$(gh pr view "$PR_NUMBER" --json body --jq '.body')"
          NEW_BODY="$(printf '%s\n\n---\n**Preview:** %s' "$CURRENT_BODY" "$PREVIEW_URL")"
          gh pr edit "$PR_NUMBER" --body "$NEW_BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger release PR preview
        if: steps.changesets.outputs.pullRequestNumber
        run: |
          PR_NUMBER="${{ steps.changesets.outputs.pullRequestNumber }}"
          PR_HEAD_SHA="$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')"
          gh workflow run release-pr-preview.yml \
            --ref changeset-release/publish \
            -f pr_head_sha="$PR_HEAD_SHA" \
            -f pr_number="$PR_NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
