<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="892" viewBox="0 0 600 446" role="img" aria-labelledby="title desc">
<title id="title">Cold rebuilds of 50,000 events</title>
<desc id="desc">Median local times before and after reuse. At 4 events per page, 11.99 and 10.90 seconds. At 256 events per page, 9.09 and 8.23 seconds. The axis starts at zero.</desc>
<rect width="600" height="446" fill="#0F172A"/>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#F8FAFC" font-size="22">
<text x="40" y="44" font-size="25" font-weight="700">Cold rebuilds of 50,000 events</text>
<path d="M112 94V367" stroke="#64748B"/><text x="112" y="395" fill="#94A3B8" font-size="17" text-anchor="middle">0</text>
<path d="M184 94V367" stroke="#64748B"/><text x="184" y="395" fill="#94A3B8" font-size="17" text-anchor="middle">2</text>
<path d="M256 94V367" stroke="#64748B"/><text x="256" y="395" fill="#94A3B8" font-size="17" text-anchor="middle">4</text>
<path d="M328 94V367" stroke="#64748B"/><text x="328" y="395" fill="#94A3B8" font-size="17" text-anchor="middle">6</text>
<path d="M400 94V367" stroke="#64748B"/><text x="400" y="395" fill="#94A3B8" font-size="17" text-anchor="middle">8</text>
<path d="M472 94V367" stroke="#64748B"/><text x="472" y="395" fill="#94A3B8" font-size="17" text-anchor="middle">10</text>
<path d="M544 94V367" stroke="#64748B"/><text x="544" y="395" fill="#94A3B8" font-size="17" text-anchor="middle">12</text>
<rect x="34" y="65" width="520" height="38" fill="#0F172A"/>
<text x="40" y="92" font-weight="700">4 events per page</text>
<rect x="34" y="210" width="520" height="38" fill="#0F172A"/>
<text x="40" y="236" font-weight="700">256 events per page</text>
<text x="98" y="137" text-anchor="end">Before</text><rect x="112" y="110" width="431.64" height="40" fill="#38BDF8"/><text x="533.64" y="137" text-anchor="end" fill="#0F172A" font-weight="700">11.99 s</text>
<text x="98" y="193" text-anchor="end">After</text><rect x="112" y="166" width="392.40" height="40" fill="#FBBF24"/><text x="494.40" y="193" text-anchor="end" fill="#0F172A" font-weight="700">10.90 s</text>
<text x="98" y="281" text-anchor="end">Before</text><rect x="112" y="254" width="327.24" height="40" fill="#38BDF8"/><text x="429.24" y="281" text-anchor="end" fill="#0F172A" font-weight="700">9.09 s</text>
<text x="98" y="337" text-anchor="end">After</text><rect x="112" y="310" width="296.28" height="40" fill="#FBBF24"/><text x="398.28" y="337" text-anchor="end" fill="#0F172A" font-weight="700">8.23 s</text>
<path d="M112 367H544" stroke="#F8FAFC" stroke-width="2"/>
<text x="328" y="429" fill="#CBD5E1" font-size="18" text-anchor="middle">Median local time (seconds)</text>
</g>
</svg>
