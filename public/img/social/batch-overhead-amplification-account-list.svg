<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 600 500" role="img" aria-labelledby="title desc">
<title id="title">Account-list loading time</title><desc id="desc">The same 51,015 source records took 35.5 seconds before the repair, 3.80 seconds with output reuse and 4.51 seconds with a later limit on results kept between pages. Individual local synthetic runs. All bars share a zero baseline.</desc>
<rect width="600" height="500" fill="#0F172A"/>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#F8FAFC" font-size="24">
<text x="40" y="44" font-size="27" fill="#F8FAFC" text-anchor="start" font-weight="700">Account-list loading time</text>
<text x="40" y="77" font-size="22" fill="#CBD5E1" text-anchor="start" font-weight="400">Same 51,015 source records</text>
<text x="40" y="106" font-size="22" fill="#CBD5E1" text-anchor="start" font-weight="400">Individual local synthetic runs</text>
<path d="M40 158V200 M40 260V302 M40 362V404" stroke="#CBD5E1" stroke-opacity="0.2"/>
<text x="40" y="468" font-size="22" fill="#CBD5E1" text-anchor="middle" font-weight="400">0</text>
<path d="M170 158V200 M170 260V302 M170 362V404" stroke="#CBD5E1" stroke-opacity="0.2"/>
<text x="170" y="468" font-size="22" fill="#CBD5E1" text-anchor="middle" font-weight="400">10</text>
<path d="M300 158V200 M300 260V302 M300 362V404" stroke="#CBD5E1" stroke-opacity="0.2"/>
<text x="300" y="468" font-size="22" fill="#CBD5E1" text-anchor="middle" font-weight="400">20</text>
<path d="M430 158V200 M430 260V302 M430 362V404" stroke="#CBD5E1" stroke-opacity="0.2"/>
<text x="430" y="468" font-size="22" fill="#CBD5E1" text-anchor="middle" font-weight="400">30</text>
<path d="M560 158V200 M560 260V302 M560 362V404" stroke="#CBD5E1" stroke-opacity="0.2"/>
<text x="560" y="468" font-size="22" fill="#CBD5E1" text-anchor="middle" font-weight="400">40</text>
<text x="40" y="142" font-size="25" fill="#F8FAFC" text-anchor="start" font-weight="600">Before</text>
<rect x="40" y="158" width="461.50" height="42" fill="#38BDF8"/>
<text x="489.5" y="187" font-size="25" fill="#0F172A" text-anchor="end" font-weight="700">35.5 s</text>
<text x="40" y="244" font-size="25" fill="#F8FAFC" text-anchor="start" font-weight="600">Output reuse</text>
<rect x="40" y="260" width="49.40" height="42" fill="#FBBF24"/>
<text x="103.4" y="289" font-size="25" fill="#F8FAFC" text-anchor="start" font-weight="700">3.80 s</text>
<text x="40" y="346" font-size="25" fill="#F8FAFC" text-anchor="start" font-weight="600">Stored results limited</text>
<rect x="40" y="362" width="58.63" height="42" fill="#FBBF24"/>
<text x="112.63" y="391" font-size="25" fill="#F8FAFC" text-anchor="start" font-weight="700">4.51 s</text>
<path d="M40 436H560" fill="none" stroke="#F8FAFC" stroke-width="2"/>
<text x="300" y="494" font-size="22" fill="#CBD5E1" text-anchor="middle" font-weight="400">Seconds</text>
</g></svg>
