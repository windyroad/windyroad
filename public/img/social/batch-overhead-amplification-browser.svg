<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1540" viewBox="0 0 600 770" role="img" aria-labelledby="title desc">
<title id="title">Larger responses, longer pauses</title><desc id="desc">For a 50,000-event synthetic browser rebuild, REST page sizes 256, 512, 1,024 and 2,048 gave median completion times 6.42, 6.28, 6.24 and 6.07 seconds. Median longest main-thread pauses were 51, 87, 158 and 276 milliseconds. Separate zero-based panels show similar completion times but much longer pauses. The operating page size remained 1,024.</desc>
<rect width="600" height="770" fill="#0F172A"/>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#F8FAFC" font-size="24">
<text x="40" y="43" font-size="27" fill="#F8FAFC" text-anchor="start" font-weight="700">Larger responses, longer pauses</text>
<text x="40" y="76" font-size="22" fill="#CBD5E1" text-anchor="start" font-weight="400">50,000 events; median results</text>
<text x="40" y="118" font-size="25" fill="#F8FAFC" text-anchor="start" font-weight="700">Rebuild time (seconds)</text>
<path d="M90 315.00H560" stroke="#CBD5E1" stroke-opacity="0.2"/>
<text x="75" y="323.0" font-size="22" fill="#CBD5E1" text-anchor="end" font-weight="400">0</text>
<path d="M90 269.29H560" stroke="#CBD5E1" stroke-opacity="0.2"/>
<text x="75" y="277.29" font-size="22" fill="#CBD5E1" text-anchor="end" font-weight="400">2</text>
<path d="M90 223.57H560" stroke="#CBD5E1" stroke-opacity="0.2"/>
<text x="75" y="231.57" font-size="22" fill="#CBD5E1" text-anchor="end" font-weight="400">4</text>
<path d="M90 177.86H560" stroke="#CBD5E1" stroke-opacity="0.2"/>
<text x="75" y="185.86" font-size="22" fill="#CBD5E1" text-anchor="end" font-weight="400">6</text>
<rect x="113" y="168.26" width="76" height="146.74" fill="#38BDF8"/>
<text x="151" y="156.26" font-size="25" fill="#F8FAFC" text-anchor="middle" font-weight="700">6.42</text>
<text x="151" y="349" font-size="24" fill="#F8FAFC" text-anchor="middle" font-weight="400">256</text>
<rect x="226" y="171.46" width="76" height="143.54" fill="#38BDF8"/>
<text x="264" y="159.46" font-size="25" fill="#F8FAFC" text-anchor="middle" font-weight="700">6.28</text>
<text x="264" y="349" font-size="24" fill="#F8FAFC" text-anchor="middle" font-weight="400">512</text>
<rect x="339" y="172.37" width="76" height="142.63" fill="#38BDF8"/>
<text x="377" y="160.37" font-size="25" fill="#F8FAFC" text-anchor="middle" font-weight="700">6.24</text>
<text x="377" y="349" font-size="24" fill="#F8FAFC" text-anchor="middle" font-weight="400">1,024</text>
<rect x="452" y="176.26" width="76" height="138.74" fill="#38BDF8"/>
<text x="490" y="164.26" font-size="25" fill="#F8FAFC" text-anchor="middle" font-weight="700">6.07</text>
<text x="490" y="349" font-size="24" fill="#F8FAFC" text-anchor="middle" font-weight="400">2,048</text>
<path d="M90 155V315H560" fill="none" stroke="#F8FAFC" stroke-width="2"/>
<text x="40" y="423" font-size="25" fill="#F8FAFC" text-anchor="start" font-weight="700">Longest pause (milliseconds)</text>
