<text x="490" y="674" font-size="24" fill="#F8FAFC" text-anchor="middle" font-weight="400">2,048</text>
<path d="M90 460V640H560" fill="none" stroke="#F8FAFC" stroke-width="2"/>
<text x="325" y="712" font-size="24" fill="#CBD5E1" text-anchor="middle" font-weight="400">REST page size (events)</text>
<text x="40" y="752" font-size="22" fill="#CBD5E1" text-anchor="start" font-weight="400">1,024 remained the operating setting.</text>
